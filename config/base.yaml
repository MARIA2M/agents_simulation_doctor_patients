# config/base.yaml — everything the profiles share (§6, 0.5)
#
# Not a profile: it has no `profile:` key and cannot be loaded on its own.
# Whatever declares `extends: base` is merged over it block by block, and what
# comes out is what `metadata.json` records — so a run is still read from one
# file. Chains are allowed: an arm extends hpc, which extends base.

sampling:
  # One per role, always sent explicitly and never left to the server (§12).
  # The doctor both asks and infers, and must vary: pinned at 0 it asks the
  # same script in every consultation, and 2.4 needs a spread to measure.
  # Writing the report is a separate step, where variation buys nothing.
  doctor_temperature: 0.7     # questions and score inference
  patient_temperature: 0.7
  report_temperature: 0.0     # writing the report
  seed: null
  context_length: 32768
  num_parallel: 1

server:
  ollama_url: "http://127.0.0.1:11434"
  # First load off GPFS can take over two minutes, and Ollama aborts if the
  # client gives up first (§6.1).
  request_timeout: 300

limits:
  # Safety net, not a criterion (1.5). Lowered from 30: a restrictive style and
  # DOCTOR.md §6 pull against each other, and whichever gives way first, the
  # consultation has to end. Observed range is 3–15 turns over e4-1 and s51.
  max_turns: 20
  report_attempts: 3   # what is still missing stays NA (§4)

# Arms, not plumbing: they change what the doctor sees, so they are explicit
# and end up in run_meta. One per run. Explained in ARCHITECTURE.md §4.1.
features:
  # off | show. Quoted on purpose: bare `off` is the YAML boolean False.
  coverage_hint: "off"
  working_notes: false

# Deterministic composition, decided by the code and not by the model (§5.1).
# Paths are relative to prompts/ and skills/.
prompts:
  doctor: DOCTOR.md
  patient: PATIENT.md
  report: REPORT.md
  doctor_rubric:
    - doctor_rubric/bipq.json
    - doctor_rubric/bmq.json

skills:
  doctor: []
  patient: []

resources:
  doctor: []
  patient: []

paths:
  patients: patients
  runs: runs
  prompts: prompts
  skills: skills
  resources: resources
