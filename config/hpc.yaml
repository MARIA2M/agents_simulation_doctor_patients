# config/hpc.yaml — baselines, arms and full batches (§6)
#
# Runs on a compute node, through the queue. The model store is not in
# ~/.ollama: export OLLAMA_MODELS=/gpfs/projects/bsc02/llm_models/ollama
# before starting the server, or only the home directory is visible (§6.1).
# Everything not named here comes from base.yaml.

profile: hpc
extends: base

models:
  doctor: "glm-4.7-flash:q8_0"  # 10/10 well-formed tool calls at T=0 (tools/probe_tools.py)
  # PROVISIONAL — chosen because it is the only unaligned patient already in
  # the Ollama store, not because it was verified. §6.2 asks for a probe
  # before choosing: does it stay in character, does it volunteer its belief
  # profile unasked, does it fold under leading questions. A larger patient
  # (gemma-4-12B via vLLM) has the capacity for the personas of 7.1, but
  # instruct models are servile enough to inflate the doctor's apparent
  # performance. Freeze the pair before the stage-7 baseline, not after.
  patient: dolphin-llama3
  # UNREACHABLE — a HuggingFace model, and causes/embeddings.py only speaks to
  # Ollama, so score_causes falls back to category overlap. See TASKS 4.3.
  embed: jina-embeddings-v4

server:
  keep_alive: "4h"
